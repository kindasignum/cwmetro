<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CatWar Поезда</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-container">
  <div class="top-bar">
    <div class="app-title">Озёрно-морской маршрут</div>
    <button class="theme-btn" id="themeBtn" title="Переключить тему">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <div class="map-viewport" id="viewport">
    <div class="map-content" id="mapContent">
      <svg viewBox="0 0 1500 950" preserveAspectRatio="xMidYMid meet" id="metroSvg">
        <rect width="1500" height="950" fill="transparent" class="dim-target" />

        <!-- Озёрная территория -->
        <g class="territory dim-target">
          <path class="territory-outline" d="M 870,320 L 870,470 Q 870,490 850,490 L 620,490" />
          <text class="territory-label" x="885" y="315" text-anchor="start">Озёрная территория</text>
        </g>

        <!-- Морская территория -->
        <g class="territory dim-target">
          <path class="territory-outline" d="M 1100,880 L 1100,570 Q 1100,550 1120,550 L 1470,550" />
          <text class="territory-label" x="1120" y="535" text-anchor="start">Морская территория</text>
        </g>

        <!-- ФИОЛЕТОВАЯ -->
        <line class="line-segment dim-target" data-line="purple" data-from="gorod" data-to="gory" id="seg-purple-gorod-gory" x1="180" y1="220" x2="400" y2="220" stroke="#8e44ad" stroke-width="10" stroke-linecap="round" />
        <line class="line-segment dim-target" data-line="purple" data-from="gory" data-to="poselok" id="seg-purple-gory-poselok" x1="400" y1="220" x2="620" y2="400" stroke="#8e44ad" stroke-width="10" stroke-linecap="round" />
        <line class="line-segment dim-target" data-line="purple" data-from="poselok" data-to="predpustynye_ozero" id="seg-purple-poselok-predpustynye_ozero" x1="620" y1="400" x2="780" y2="400" stroke="#8e44ad" stroke-width="10" stroke-linecap="round" />

        <!-- ЗЕЛЁНАЯ -->
        <line class="line-segment dim-target" data-line="green" data-from="predpustynye_ozero" data-to="oazis" id="seg-green-predpustynye_ozero-oazis" x1="780" y1="400" x2="900" y2="520" stroke="#27ae60" stroke-width="10" stroke-linecap="round" />
        <line class="line-segment dim-target" data-line="green" data-from="oazis" data-to="centr_labirinta" id="seg-green-oazis-centr_labirinta" x1="900" y1="520" x2="1020" y2="620" stroke="#27ae60" stroke-width="10" stroke-linecap="round" />

        <!-- СИНЯЯ -->
        <line class="line-segment dim-target" data-line="blue" data-from="centr_labirinta" data-to="derevnya" id="seg-blue-centr_labirinta-derevnya" x1="1020" y1="620" x2="1200" y2="620" stroke="#2980b9" stroke-width="10" stroke-linecap="round" />
        <line class="line-segment dim-target" data-line="blue" data-from="derevnya" data-to="predpustynye_more" id="seg-blue-derevnya-predpustynye_more" x1="1200" y1="620" x2="1400" y2="620" stroke="#2980b9" stroke-width="10" stroke-linecap="round" />

        <!-- ОРАНЖЕВАЯ -->
        <line class="line-segment dim-target" data-line="orange" data-from="predpustynye_more" data-to="derevnya" id="seg-orange-predpustynye_more-derevnya" x1="1440" y1="672" x2="1240" y2="672" stroke="#e67e22" stroke-width="10" stroke-linecap="round" />
        <line class="line-segment dim-target" data-line="orange" data-from="derevnya" data-to="ruiny" id="seg-orange-derevnya-ruiny" x1="1240" y1="672" x2="1130" y2="800" stroke="#e67e22" stroke-width="10" stroke-linecap="round" />

        <!-- РОЗОВАЯ (Деревенская) -->
        <line class="line-segment dim-target" data-line="pink" data-from="derevnya" data-to="centr_labirinta" id="seg-pink-derevnya-centr_labirinta" x1="1200" y1="606" x2="1020" y2="606" stroke="#e91e8c" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" />

        <!-- ЖЁЛТАЯ (Долинная) -->
        <line class="line-segment dim-target" data-line="yellow" data-from="centr_labirinta" data-to="gornaya_dolina" id="seg-yellow-centr_labirinta-gornaya_dolina" x1="1020" y1="620" x2="1180" y2="380" stroke="#d4a800" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 8" />

        <line id="transfer-more" class="dim-target" x1="1400" y1="620" x2="1440" y2="672" stroke="#7f7f8a" stroke-width="3" stroke-dasharray="5 5" />
        <line id="transfer-derevnya" class="dim-target" x1="1200" y1="620" x2="1240" y2="672" stroke="#7f7f8a" stroke-width="3" stroke-dasharray="5 5" />

        <!-- СТРЕЛКИ -->
        <g class="side-arrow dim-target">
          <line class="side-arrow-line" x1="400" y1="155" x2="400" y2="140" />
          <polygon class="side-arrow-head" points="400,134 395,143 405,143" />
          <text class="side-arrow-label" x="400" y="126" text-anchor="middle">к Клану Падающей Воды и Северному клану</text>
        </g>
        <g class="side-arrow dim-target">
          <line class="side-arrow-line" x1="780" y1="444" x2="780" y2="459" />
          <polygon class="side-arrow-head" points="780,465 775,456 785,456" />
          <text class="side-arrow-label" x="780" y="480" text-anchor="middle">к озёрным племенам</text>
        </g>
        <g class="side-arrow dim-target">
          <line class="side-arrow-line" x1="838" y1="530" x2="815" y2="530" />
          <polygon class="side-arrow-head" points="809,530 818,525 818,535" />
          <text class="side-arrow-label" x="810" y="546" text-anchor="middle">в Лабиринт Острых Зубьев</text>
        </g>
        <g class="side-arrow dim-target">
          <line class="side-arrow-line" x1="962" y1="530" x2="985" y2="530" />
          <polygon class="side-arrow-head" points="991,530 982,525 982,535" />
          <text class="side-arrow-label" x="990" y="546" text-anchor="middle">на Великий Путь</text>
        </g>
        <g class="side-arrow dim-target">
          <line class="side-arrow-line" x1="1440" y1="620" x2="1465" y2="620" />
          <polygon class="side-arrow-head" points="1471,620 1462,615 1462,625" />
          <text class="side-arrow-label" x="1455" y="600" text-anchor="middle">к морским</text>
          <text class="side-arrow-label" x="1455" y="612" text-anchor="middle">племенам</text>
        </g>

        <!-- СТАНЦИИ -->
        <g class="station dim-target" data-id="gorod" data-name="Город" data-lines="purple">
          <circle cx="180" cy="220" r="12" fill="#8e44ad" stroke="white" stroke-width="3" class="station-circle" />
          <text x="180" y="190" class="station-label">Город</text>
        </g>
        <g class="station dim-target" data-id="gory" data-name="Горы" data-lines="purple">
          <circle cx="400" cy="220" r="12" fill="#8e44ad" stroke="white" stroke-width="3" class="station-circle" />
          <text x="400" y="190" class="station-label">Горы</text>
        </g>
        <g class="station dim-target" data-id="poselok" data-name="Посёлок" data-lines="purple">
          <circle cx="620" cy="400" r="12" fill="#8e44ad" stroke="white" stroke-width="3" class="station-circle" />
          <text x="620" y="370" class="station-label">Посёлок</text>
        </g>
        <g class="station dim-target" data-id="oazis" data-name="Оазис" data-lines="green">
          <circle cx="900" cy="520" r="12" fill="#27ae60" stroke="white" stroke-width="3" class="station-circle" />
          <text x="900" y="490" class="station-label">Оазис</text>
        </g>
        <g class="station dim-target" data-id="ruiny" data-name="Руины" data-lines="orange">
          <circle cx="1130" cy="800" r="12" fill="#e67e22" stroke="white" stroke-width="3" class="station-circle" />
          <text x="1130" y="835" class="station-label">Руины</text>
        </g>

        <g class="station dim-target" data-id="predpustynye_more" data-name="Предпустынье (море)" data-lines="orange,blue">
          <circle cx="1400" cy="620" r="10" fill="#2980b9" stroke="white" stroke-width="2.5" class="station-circle" />
          <circle cx="1440" cy="672" r="10" fill="#e67e22" stroke="white" stroke-width="2.5" class="station-circle" />
          <text x="1400" y="580" class="station-label" style="font-weight:700; font-size:14px;">Предпустынье</text>
          <text x="1400" y="598" class="station-label" style="font-weight:700; font-size:13px; fill:#2980b9;">(море)</text>
        </g>

        <g class="station dim-target" data-id="derevnya" data-name="Деревня" data-lines="orange,blue,pink">
          <circle cx="1200" cy="620" r="10" fill="#2980b9" stroke="white" stroke-width="2.5" class="station-circle" />
          <circle cx="1240" cy="672" r="10" fill="#e67e22" stroke="white" stroke-width="2.5" class="station-circle" />
          <text x="1200" y="580" class="station-label" style="font-weight:700; font-size:15px;">Деревня</text>
        </g>

        <g class="station dim-target" data-id="predpustynye_ozero" data-name="Предпустынье (озеро)" data-lines="purple,green">
          <path d="M 780,386 A 14,14 0 0 0 780,414 Z" fill="#8e44ad" stroke="white" stroke-width="2.5" class="pill-half" stroke-linejoin="round" />
          <path d="M 780,386 A 14,14 0 0 1 780,414 Z" fill="#27ae60" stroke="white" stroke-width="2.5" class="pill-half" stroke-linejoin="round" />
          <line x1="780" y1="386" x2="780" y2="414" stroke="white" stroke-width="2" />
          <text x="780" y="360" class="station-label" style="font-weight:700; font-size:14px;">Предпустынье</text>
          <text x="780" y="380" class="station-label" style="font-weight:700; font-size:13px; fill:#27ae60;">(озеро)</text>
        </g>

        <g class="station dim-target" data-id="centr_labirinta" data-name="Центр лабиринта" data-lines="green,blue,pink,yellow">
          <path d="M 1020,606 A 14,14 0 0 0 1020,634 Z" fill="#27ae60" stroke="white" stroke-width="2.5" class="pill-half" stroke-linejoin="round" />
          <path d="M 1020,606 A 14,14 0 0 1 1020,634 Z" fill="#2980b9" stroke="white" stroke-width="2.5" class="pill-half" stroke-linejoin="round" />
          <line x1="1020" y1="606" x2="1020" y2="634" stroke="white" stroke-width="2" />
          <text x="1020" y="660" class="station-label" style="font-weight:700; font-size:15px;">Центр лабиринта</text>
        </g>

        <g class="station dim-target" data-id="gornaya_dolina" data-name="Горная долина" data-lines="yellow">
          <circle cx="1180" cy="380" r="12" fill="#d4a800" stroke="white" stroke-width="3" class="station-circle" />
          <text x="1180" y="350" class="station-label" style="font-weight:700; font-size:14px;">Горная долина</text>
        </g>

        <g id="bubbleLayer"></g>
        <g id="trainsLayer"></g>
        <g id="trainTooltipLayer"></g>
      </svg>
    </div>
  </div>

  <div class="route-panel mob-medium" id="routePanel">
    <div class="panel-handle" id="panelHandle">
      <span class="panel-handle-bar"></span>
    </div>
    <div class="route-field">
      <button type="button" class="route-field-btn" id="fromBtn"><span class="field-marker empty" id="fromMarker"></span><span class="field-label placeholder" id="fromLabel">Откуда</span></button>
      <button class="clear-field-btn" id="fromClear">×</button>
      <div class="dropdown" id="fromDropdown"></div>
    </div>
    <button class="swap-btn" id="swapBtn">⇆</button>
    <div class="route-field">
      <button type="button" class="route-field-btn" id="toBtn"><span class="field-marker empty" id="toMarker"></span><span class="field-label placeholder" id="toLabel">Куда</span></button>
      <button class="clear-field-btn" id="toClear">×</button>
      <div class="dropdown" id="toDropdown"></div>
    </div>
    <div class="route-summary" id="routeSummary">Выберите станции</div>

    <div class="planner" id="planner">
      <div class="planner-toggle" id="plannerToggle">
        <button type="button" class="planner-tab active" data-mode="now">Сейчас</button>
        <button type="button" class="planner-tab" data-mode="planned">Запланировать</button>
      </div>
      <div class="planner-inputs" id="plannerInputs">
        <div class="planner-field">
          <label for="plannerDate">Дата</label>
          <input type="date" id="plannerDate">
        </div>
        <div class="planner-field">
          <label for="plannerTime">Время (МСК)</label>
          <input type="time" id="plannerTime">
        </div>
      </div>
    </div>

    <div class="route-timing" id="routeTiming">
      <div class="timing-row"><span class="timing-label">Отправление</span><span class="timing-value" id="departureTime">—</span></div>
      <div class="timing-row"><span class="timing-label">Прибытие</span><span class="timing-value" id="arrivalTime">—</span></div>
      <div class="timing-durations">
        <div class="timing-duration wait" id="waitDuration"><span class="duration-label">До отправления</span>—</div>
        <div class="timing-duration" id="routeDuration"><span class="duration-label">В пути</span>—</div>
      </div>
      <div class="timing-note" id="timingNote"></div>
      <div class="route-details" id="routeDetails">
        <button type="button" class="route-details-toggle" id="routeDetailsToggle"><span>Детали маршрута</span><span class="details-arrow">▼</span></button>
        <div class="route-details-body" id="routeDetailsBody"></div>
      </div>
    </div>
    <div class="author-line">Схема и расписание: <a href="https://catwar.net/cat207302" target="_blank" rel="noopener">Лиха Беда</a></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#8e44ad;"></span> Горная</div>
    <div class="legend-item"><span class="legend-dot" style="background:#e67e22;"></span> Руинная</div>
    <div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span> Озёрная</div>
    <div class="legend-item"><span class="legend-dot" style="background:#2980b9;"></span> Морская</div>
    <div class="legend-item temporary" data-color="pink"><span class="legend-dot"></span> Деревенская <span style="font-size:10px;color:#e91e8c;margin-left:2px;">(врем.)</span></div>
    <div class="legend-item temporary" data-color="yellow"><span class="legend-dot"></span> Долинная <span style="font-size:10px;color:#d4a800;margin-left:2px;">(врем.)</span></div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn">+</button>
    <button class="zoom-btn" id="zoomOut">−</button>
  </div>
  <div class="hint" id="hint">Нажмите на станцию, чтобы начать маршрут</div>
</div>

<!-- Данные -->
<script src="js/data/stations.js"></script>
<script src="js/core/time.js"></script>
<script src="js/data/schedules.js"></script>
<!-- Ядро -->
<script src="js/core/graph.js"></script>
<script src="js/core/routing.js"></script>
<!-- UI -->
<script src="js/ui/theme.js"></script>
<script src="js/ui/route-panel.js"></script>
<script src="js/ui/route-highlight.js"></script>
<script src="js/ui/route-details.js"></script>
<script src="js/ui/planner.js"></script>
<script src="js/ui/live-trains.js"></script>
<!-- Взаимодействия -->
<script src="js/interactions/pan-zoom.js"></script>
<script src="js/interactions/mobile-panel.js"></script>
<!-- Инициализация -->
<script src="js/main.js"></script>
</body>
</html>
